name: Identite

on: [push]

jobs:
  nom:
    runs-on: ubuntu-latest
    steps:
      - name: Afficher le nom
        run: echo "Nom ${{ vars.NOM }}"

  prenom:
    runs-on: ubuntu-latest
    steps:
      - name: Afficher le prenom
        run: echo "Prenom ${{ vars.PRENOM }}"

  email:
    runs-on: ubuntu-latest
    steps:
      - name: Afficher email
        run: echo "Email ${{ vars.EMAIL }}"
